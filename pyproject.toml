[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmind-local"
version = "0.7.0"
description = "BookMind Local: локальный анализ книг и серий с помощью Ollama и Qwen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]

[project.scripts]
bookmind-models = "bookmind.main:cli"

[project.gui-scripts]
bookmind = "bookmind.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookmind = ["data/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: требует запущенный Ollama (запуск: pytest -m integration)",
]
addopts = "-m 'not integration'"
